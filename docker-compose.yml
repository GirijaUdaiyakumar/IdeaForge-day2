version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - ./data/db:/data/db
    ports:
      - '27017:27017'

  server:
    build: ./server
    ports:
      - '5000:5000'
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ideaforge
      - PORT=5000
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - '5173:80'
    depends_on:
      - server
